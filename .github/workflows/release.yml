name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - name: Version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^ \* Version:' wa-charts.php | awk '{print $NF}')
          CONST=$(grep -m1 "define( 'WA_CHARTS_VERSION'" wa-charts.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "tag=$TAG header=$HEADER const=$CONST"
          test "$TAG" = "$HEADER" && test "$TAG" = "$CONST"
      - run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Build zip
        run: |
          mkdir -p dist/wa-charts
          rsync -a --exclude-from=.distignore ./ dist/wa-charts/
          cd dist && zip -qr wa-charts.zip wa-charts && cd ..
          unzip -l dist/wa-charts.zip
          ! unzip -l dist/wa-charts.zip | grep -E ' wa-charts/(tests|node_modules|src)/| wa-charts/\.git'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/wa-charts.zip --title "$GITHUB_REF_NAME" --generate-notes
